# Trilium Workflow Increase Test Coverage

## Action

Follow the increase-test-coverage workflow:
1. Identify modules/services/utilities with low test coverage.
2. Create or update corresponding .spec.ts files to add more tests.
3. Sometimes update implementation files to facilitate testing or fix minor issues.
4. Commit changes with a message indicating increased coverage.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~4x per month
- Files: */src/**/*.spec.ts, */src/**/*.ts

