# Trilium Workflow Dependency Update

## Action

Follow the dependency-update workflow:
1. Edit package.json to update the dependency version.
2. Update pnpm-lock.yaml to reflect the new dependency tree.
3. Sometimes update related test/spec files if breaking changes occur.
4. Commit with a message referencing the dependency and new version.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~3x per month
- Files: */package.json, pnpm-lock.yaml

